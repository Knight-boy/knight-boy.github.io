{% comment %}
<!--
User scripts hook. Runs on the initial page load and (via the
hy-push-state-load listener below, cf. the CloudFlare example) again after
every client-side navigation handled by <hy-push-state>.

Currently hosts the right-hand table-of-contents panel for posts.
It has two modes:
  * inline:  the content column leaves enough room on the right, the panel
             sits next to the content column;
  * overlay: not enough room (narrow screens), a small button pinned to the
             right edge toggles an overlay panel sliding in from the right.
-->
{% endcomment %}
<script>
  !function (w, d) {
    var pushStateEl = d.getElementsByTagName('hy-push-state')[0];
    var panel = null;
    var btn = null;
    var items = [];
    var overlay = false;
    var open = false;

    function isPostPage() {
      var main = d.getElementById('_main');
      return !!(main && main.classList.contains('layout-post'));
    }

    function collectHeadings() {
      var doc = d.querySelector('#_main article.page.post');
      if (!doc) return [];
      var nodes = doc.querySelectorAll('h2[id], h3[id]');
      var out = [];
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (el.hidden || el.classList.contains('page-title') || el.classList.contains('sr-only') || el.classList.contains('hr')) continue;
        out.push(el);
      }
      return out;
    }

    function headingText(h) {
      var clone = h.cloneNode(true);
      var junk = clone.querySelectorAll('.permalink, a.anchor');
      for (var j = 0; j < junk.length; j++) junk[j].parentNode.removeChild(junk[j]);
      return (clone.textContent || '').trim();
    }

    function onClick(e) {
      var id = this.getAttribute('data-target');
      var h = id ? d.getElementById(id) : null;
      if (!h) return;
      e.preventDefault();
      if (overlay && open) close();
      h.scrollIntoView({ 'behavior': 'smooth' });
      if (w.history && w.history.replaceState) {
        try { w.history.replaceState(null, '', '#' + id); } catch (err) { /* ignore */ }
      }
    }

    function setBtn() {
      if (!btn) return;
      btn.style.display = (overlay && !open && items.length) ? 'flex' : 'none';
    }

    function close() {
      if (!overlay) return;
      open = false;
      if (panel) panel.classList.remove('toc-open');
      setBtn();
    }

    function handleOutside(e) {
      if (!overlay || !open) return;
      var t = e.target;
      var inPanel = panel && (t === panel || panel.contains(t));
      var inBtn = btn && (t === btn || btn.contains(t));
      if (!inPanel && !inBtn) close();
    }

    function onKey(e) {
      if (e.key === 'Escape') close();
    }

    function toggle(e) {
      e && e.preventDefault();
      if (!overlay) return;
      open = !open;
      apply();
    }

    function hide() {
      if (panel) panel.style.display = 'none';
      if (btn) btn.style.display = 'none';
    }

    function computeMode() {
      var main = d.getElementById('_main');
      if (!main) return 'hidden';
      var rect = main.getBoundingClientRect();
      var inlineWidth = Math.min(280, w.innerWidth - rect.right - 28);
      if (inlineWidth >= 200) return 'inline';
      if (w.innerWidth >= 764) return 'overlay';
      return 'hidden';
    }

    function highlight() {
      if (!items.length || !panel || panel.style.display === 'none') return;
      var current = 0;
      for (var i = 0; i < items.length; i++) {
        if (items[i].heading.getBoundingClientRect().top <= 140) current = i;
      }
      if (w.innerHeight + w.scrollY >= d.documentElement.scrollHeight - 4) current = items.length - 1;
      for (var k = 0; k < items.length; k++) {
        items[k].anchor.classList[k === current ? 'add' : 'remove']('active');
      }
    }

    function apply() {
      if (!panel) return;
      if (!items.length || !isPostPage()) { hide(); return; }

      var mode = computeMode();
      var main = d.getElementById('_main');
      var rect = main ? main.getBoundingClientRect() : null;

      if (mode === 'inline' && rect) {
        overlay = false;
        open = false;
        panel.classList.remove('overlay', 'toc-open');
        panel.style.display = 'block';
        panel.style.left = Math.round(rect.right + 16) + 'px';
        panel.style.width = Math.round(Math.min(280, w.innerWidth - rect.right - 28)) + 'px';
      } else if (mode === 'overlay') {
        overlay = true;
        panel.classList.add('overlay');
        panel.classList[open ? 'add' : 'remove']('toc-open');
        panel.style.display = 'block';
        panel.style.left = '';
        panel.style.width = Math.min(280, Math.round(w.innerWidth * 0.76)) + 'px';
      } else {
        hide();
      }
      setBtn();
      highlight();
    }

    function buildPanel() {
      if (!panel) {
        panel = d.createElement('aside');
        panel.className = 'toc-panel';
        d.body.appendChild(panel);

        btn = d.createElement('div');
        btn.className = 'toc-btn';
        btn.setAttribute('role', 'button');
        btn.setAttribute('aria-label', '打开文章目录');
        btn.setAttribute('tabindex', '0');
        btn.textContent = '目录';
        btn.addEventListener('click', toggle);
        btn.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(e); }
        });
        d.body.appendChild(btn);

        w.addEventListener('resize', apply, { 'passive': true });
        w.addEventListener('scroll', highlight, { 'passive': true });
        d.addEventListener('click', handleOutside);
        d.addEventListener('keydown', onKey);
      }
      panel.innerHTML = '';
      items = [];

      var headings = isPostPage() ? collectHeadings() : [];
      if (headings.length < 2) { hide(); return; }

      var title = d.createElement('div');
      title.className = 'toc-title';
      title.textContent = '文章目录';
      panel.appendChild(title);

      var outUl = d.createElement('ul');
      var lastLi = null;
      var subUl = null;
      for (var i = 0; i < headings.length; i++) {
        var h = headings[i];
        var a = d.createElement('a');
        a.textContent = headingText(h);
        a.href = '#' + h.id;
        a.setAttribute('data-target', h.id);
        a.addEventListener('click', onClick);

        var li = d.createElement('li');
        li.appendChild(a);

        if (h.tagName === 'H3' && lastLi) {
          if (!subUl) { subUl = d.createElement('ul'); lastLi.appendChild(subUl); }
          subUl.appendChild(li);
        } else if (h.tagName === 'H3') {
          /* NOTE: avoid `//` line comments in this inline script — the
             compress layout strips newlines, which would comment out the
             rest of the script. h3 without a preceding h2 (flat articles):
             render as a top-level item WITHOUT becoming the parent of
             later h3 items. */
          outUl.appendChild(li);
        } else {
          outUl.appendChild(li);
          lastLi = li;
          subUl = null;
        }
        items.push({ 'heading': h, 'anchor': a });
      }
      panel.appendChild(outUl);
      open = false;
      apply();
    }

    buildPanel();
    if (pushStateEl) {
      pushStateEl.addEventListener('hy-push-state-load', buildPanel);
      pushStateEl.addEventListener('hy-push-state-after', buildPanel);
    }
  }(window, document);

  /* === Dark (night) theme toggle ========================================= */
  !function (w, d) {
    var KEY = 'hy-theme';
    var body = d.body;
    var btn = d.getElementById('_theme-toggle-mobile');

    function resolve() {
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
      if (saved === 'dark' || saved === 'light') return saved;
      return (w.matchMedia && w.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }

    function isDark() {
      return body.classList.contains('dark-mode');
    }

    /* The html-level class was only needed before first paint. */
    d.documentElement.classList.remove('dark-mode-early');

    if (body) body.classList[resolve() === 'dark' ? 'add' : 'remove']('dark-mode');

    if (btn) {
      btn.addEventListener('click', function () {
        var next = isDark() ? 'light' : 'dark';
        body.classList[next === 'dark' ? 'add' : 'remove']('dark-mode');
        try { localStorage.setItem(KEY, next); } catch (e) { /* ignore */ }
      });
    }
  }(window, document);

  /* === Collapsible left sidebar (desktop) =================================
     Pure CSS collapse via the `sidebar-collapsed` class on <html>; the
     preference is persisted and already applied early from my-head.html. */
  !function (w, d) {
    var KEY = 'hy-sidebar';
    var root = d.documentElement;
    var btn = d.getElementById('_sidebar-toggle');

    function hidden() {
      return root.classList.contains('sidebar-collapsed');
    }

    if (btn) {
      btn.addEventListener('click', function () {
        if (hidden()) {
          root.classList.remove('sidebar-collapsed');
          try { localStorage.setItem(KEY, 'open'); } catch (e) { /* ignore */ }
        } else {
          root.classList.add('sidebar-collapsed');
          try { localStorage.setItem(KEY, 'hidden'); } catch (e) { /* ignore */ }
        }
        /* Let fixed-position widgets (e.g. the TOC panel) realign. */
        if (w.dispatchEvent) w.dispatchEvent(new Event('resize'));
      });
    }
  }(window, document);

  /* === Floating back-to-top ===============================================
     Pinned to the bottom-right (markup in `_includes/body/menu.html`,
     styles in my-style.scss). Shows only after scrolling past ~one screen. */
  !function (w, d) {
    var btn = d.getElementById('_back-to-top');
    if (!btn) return;
    var ticking = false;

    function update() {
      ticking = false;
      var y = w.pageYOffset || d.documentElement.scrollTop || 0;
      var threshold = Math.round((d.documentElement.clientHeight || 600) * 0.6);
      btn.classList[y > threshold ? 'add' : 'remove']('show');
    }

    function onScroll() {
      if (ticking) return;
      ticking = true;
      if (w.requestAnimationFrame) w.requestAnimationFrame(update);
      else update();
    }

    btn.addEventListener('click', function () {
      if ('scrollBehavior' in d.documentElement.style) {
        w.scrollTo({ 'top': 0, 'behavior': 'smooth' });
      } else {
        w.scrollTo(0, 0);
      }
    });

    w.addEventListener('scroll', onScroll, { 'passive': true });
    update();
  }(window, document);

  /* === Drawer covers the TOC ==============================================
     The sidebar drawer overlay (menu button) spans the whole page. While it
     is expanded, the TOC button/panel must go away instead of stacking on
     top of it. hy-drawer fires `hy-drawer-transitioned` with a boolean
     detail (opened) — mirror it into a `drawer-open` class on <html>;
     the CSS side lives in my-style.scss. */
  !function (w, d) {
    var root = d.documentElement;
    var drawer = d.getElementsByTagName('hy-drawer')[0];
    if (!drawer) return;

    function apply(opened) {
      root.classList[opened ? 'add' : 'remove']('drawer-open');
    }

    apply(drawer.hasAttribute('opened'));

    drawer.addEventListener('hy-drawer-transitioned', function (e) {
      apply(!!(e && e.detail));
    });
  }(window, document);

  /* === Code blocks: language label + copy button ==========================
     Decorates every `.highlight` block inside the article prose with a small
     header bar: the highlighted language (detected from the `language-foo`
     class Rouge emits) on the left, a copy-to-clipboard button on the right.
     Runs after the initial load and after every hy-push-state navigation —
     blocks already carrying a bar (marked with data-cb) are skipped. */
  !function (w, d) {
    var LANGS = {
      'c++': 'C++', 'cpp': 'C++', 'cc': 'C++', 'cxx': 'C++',
      'c#': 'C#', 'csharp': 'C#', 'cs': 'C#', 'java': 'Java', 'javascript': 'JavaScript', 'js': 'JavaScript',
      'typescript': 'TypeScript', 'ts': 'TypeScript', 'python': 'Python', 'py': 'Python',
      'golang': 'Go', 'go': 'Go', 'rust': 'Rust', 'rs': 'Rust', 'ruby': 'Ruby', 'rb': 'Ruby',
      'php': 'PHP', 'swift': 'Swift', 'kotlin': 'Kotlin', 'kt': 'Kotlin', 'c': 'C',
      'shell': 'Shell', 'bash': 'Shell', 'sh': 'Shell', 'zsh': 'Shell',
      'powershell': 'PowerShell', 'pwsh': 'PowerShell', 'ps1': 'PowerShell',
      'html': 'HTML', 'xhtml': 'XHTML', 'xml': 'XML', 'erb': 'ERB',
      'css': 'CSS', 'scss': 'SCSS', 'sass': 'Sass', 'less': 'Less', 'stylus': 'Stylus',
      'json': 'JSON', 'yaml': 'YAML', 'yml': 'YAML', 'toml': 'TOML', 'ini': 'INI',
      'markdown': 'Markdown', 'md': 'Markdown', 'sql': 'SQL', 'mysql': 'SQL',
      'diff': 'Diff', 'text': 'Text', 'plaintext': 'Text', 'txt': 'Text',
      'dockerfile': 'Dockerfile', 'docker': 'Dockerfile', 'objectivec': 'Objective-C',
      'latex': 'LaTeX', 'tex': 'LaTeX', 'matlab': 'MATLAB', 'cmake': 'CMake',
      'makefile': 'Makefile', 'make': 'Makefile', 'coffee': 'CoffeeScript',
      'coffeescript': 'CoffeeScript', 'lua': 'Lua', 'perl': 'Perl', 'scala': 'Scala',
      'haskell': 'Haskell', 'erlang': 'Erlang', 'elixir': 'Elixir', 'clojure': 'Clojure',
      'commonlisp': 'Common Lisp', 'vim': 'Vim', 'viml': 'Vim', 'gradle': 'Gradle',
      'groovy': 'Groovy', 'dart': 'Dart', 'r': 'R', 'batch': 'Batch', 'bat': 'Batch'
    };

    function detectLang(block) {
      var m = (block.className || '').match(/language-([\w#+.-]+)/);
      var scope = block;
      if (!m) {
        var inner = block.querySelector('[class*="language-"]');
        if (inner) m = (inner.className || '').match(/language-([\w#+.-]+)/);
      }
      if (!m) {
        var p = block.parentElement;
        while (p && !m && p !== d.body) {
          m = (p.className || '').match(/language-([\w#+.-]+)/);
          p = p.parentElement;
        }
      }
      if (!m) return '\u4EE3\u7801';
      var key = m[1].toLowerCase();
      /* Rouge writes c++ / c# as `language-c#` etc.; keep the literal key as-is. */
      if (key === 'c%23') return 'C#';
      if (LANGS[key]) return LANGS[key];
      return key.toUpperCase();
    }

    function legacyCopy(text) {
      var ta = d.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      d.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = d.execCommand('copy'); } catch (err) { ok = false; }
      d.body.removeChild(ta);
      return ok;
    }

    function copyCode(e) {
      e.preventDefault();
      e.stopPropagation();
      var btn = e.currentTarget;
      if (btn.getAttribute('data-busy')) return;
      var block = btn.parentNode.parentNode;
      var pre = block.querySelector('pre');
      var text = pre ? (pre.textContent || '').replace(/\n$/, '') : '';
      if (!text) return;
      var label = btn.textContent;
      btn.setAttribute('data-busy', '1');
      var flash = function () { btn.textContent = '\u5DF2\u590D\u5236'; };
      var reset = function () {
        btn.removeAttribute('data-busy');
        btn.textContent = label;
      };
      if (navigator.clipboard && navigator.clipboard.writeText && w.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () {
          flash();
          w.setTimeout(reset, 1200);
        }, function () {
          legacyCopy(text);
          flash();
          w.setTimeout(reset, 1200);
        });
      } else {
        legacyCopy(text);
        flash();
        w.setTimeout(reset, 1200);
      }
    }

    function decorate() {
      var blocks = d.querySelectorAll('#_main .highlight');
      for (var i = 0; i < blocks.length; i++) {
        var block = blocks[i];
        /* Rouge nests `.highlight` twice (outer div + inner pre). Only the
           outermost element gets a bar — skip anything inside one. */
        /* Rouge nests `.highlight` twice (outer div + inner pre, both carry
           the class). Skip any block whose ANCESTORS already have one — the
           outermost element is the only one that gets a bar. */
        if (block.parentElement && block.parentElement.closest && block.parentElement.closest('.highlight')) continue;
        if (block.getAttribute('data-cb')) continue;
        block.setAttribute('data-cb', '1');

        var bar = d.createElement('div');
        bar.className = 'cb-bar';

        var lang = d.createElement('span');
        lang.className = 'cb-lang';
        lang.textContent = detectLang(block);

        var btn = d.createElement('button');
        btn.type = 'button';
        btn.className = 'cb-copy';
        btn.textContent = '\u590D\u5236';
        btn.addEventListener('click', copyCode);

        bar.appendChild(lang);
        bar.appendChild(btn);
        block.insertBefore(bar, block.firstChild);
      }
    }

    var pushStateEl = d.getElementsByTagName('hy-push-state')[0];
    decorate();
    if (pushStateEl) {
      pushStateEl.addEventListener('hy-push-state-load', decorate);
      pushStateEl.addEventListener('hy-push-state-after', decorate);
    }
  }(window, document);

  /* === Cookies banner =====================================================
     The banner template (`_cookies-banner-template`) ships with the free
     theme, but the code that mounts it lives in the PRO bundle — so it
     never actually appeared. This IIFE reproduces that logic: show the
     banner until the visitor accepts, then persist consent and notify the
     analytics gate in analytics.html via the `hy--cookies-ok` event. */
  !function (w, d) {
    var KEY = 'hy--cookies-ok';

    function accepted() {
      return d.cookie.indexOf(KEY + '=true') > -1 ||
        (w.localStorage && w.localStorage.getItem(KEY) === 'true');
    }

    function accept() {
      w.localStorage && w.localStorage.setItem(KEY, 'true');
      var exp = new Date(Date.now() + 31536e6).toUTCString();
      d.cookie = KEY + '=true; expires=' + exp + '; path=/';
      var banner = d.getElementById('_cookies-banner');
      banner && banner.parentNode.removeChild(banner);
      notifyAnalytics();
    }

    function notifyAnalytics() {
      try { d.dispatchEvent(new CustomEvent('hy--cookies-ok', { bubbles: true })); }
      catch (e) { /* old engines without CustomEvent: consent flag is still stored */ }
    }

    if (accepted()) { notifyAnalytics(); return; }

    var tpl = d.getElementById('_cookies-banner-template');
    if (!tpl) return;
    var banner = tpl.content ? tpl.content.cloneNode(true).firstElementChild : null;
    if (!banner) return;
    d.body.appendChild(banner);

    var ok = d.getElementById('_cookies-ok');
    ok && ok.addEventListener('click', accept);
  }(window, document);

  /* === Site search =========================================================
     Full-text search over the Liquid-built JSON index at
     /assets/search-index.json (one record per post: title, url, date,
     categories, tags, excerpt, truncated body). Zero dependencies: terms are
     matched with plain indexOf (fully Unicode/Chinese safe); every term must
     hit the record (AND). Scoring: title 60 + tags 40 + categories 20 +
     excerpt 20, plus one point per body hit (capped at 50).
     The button markup lives in _includes/body/menu.html, styles in
     _sass/my-style.scss. The index is fetched lazily on first query and kept
     for the lifetime of the page (SPA navigations keep it warm). */
  !function (w, d) {
    var INDEX_URL = '/assets/search-index.json';
    var MAX_RESULTS = 50;
    var DEBOUNCE = 120;
    var open = false;
    var loading = false;
    var idx = null;
    var timer = null;
    var overlay = null, panel = null, input = null, meta = null, results = null;
    var btn = d.getElementById('_search-toggle');
    if (!btn) return;

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setMeta(text) {
      meta.textContent = text;
    }

    function fetchIndex(cb) {
      if (idx) { cb(idx); return; }
      if (loading) return;
      loading = true;
      setMeta('\u6b63\u5728\u52a0\u8f7d\u641c\u7d22\u7d22\u5f15\uff0c\u7a0d\u5019\u2026');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', INDEX_URL, true);
      xhr.onload = function () {
        loading = false;
        var docs = null;
        try { docs = JSON.parse(xhr.responseText); } catch (e) { docs = null; }
        if (!docs) { setMeta('\u641c\u7d22\u7d22\u5f15\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5'); return; }
        idx = docs;
        cb(docs);
      };
      xhr.onerror = function () {
        loading = false;
        setMeta('\u641c\u7d22\u7d22\u5f15\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7f51\u7edc\u540e\u91cd\u8bd5');
      };
      xhr.send();
    }

    function countHits(hay, needle) {
      var n = 0;
      var p = hay.indexOf(needle);
      while (p > -1 && n < 50) {
        n++;
        p = hay.indexOf(needle, p + needle.length);
      }
      return n;
    }

    function tokenize(q) {
      var out = [];
      var arr = String(q).toLowerCase().split(/\s+/);
      for (var i = 0; i < arr.length; i++) if (arr[i]) out.push(arr[i]);
      return out;
    }

    function asList(v) {
      return v instanceof Array ? v.join(' ') : String(v || '');
    }

    function search(docs, terms) {
      var hits = [];
      for (var i = 0; i < docs.length; i++) {
        var doc = docs[i];
        var title = String(doc.t || '').toLowerCase();
        var tags = asList(doc.g).toLowerCase();
        var cats = asList(doc.c).toLowerCase();
        var desc = String(doc.e || '').toLowerCase();
        var body = String(doc.b || '').toLowerCase();
        var score = 0;
        var ok = true;
        for (var t = 0; t < terms.length; t++) {
          var term = terms[t];
          var s = 0;
          if (title.indexOf(term) > -1) s += 60;
          if (tags.indexOf(term) > -1) s += 40;
          if (cats.indexOf(term) > -1) s += 20;
          if (desc.indexOf(term) > -1) s += 20;
          s += countHits(body, term);
          if (!s) { ok = false; break; }
          score += s;
        }
        if (ok) hits.push({ 'doc': doc, 'score': score });
      }
      hits.sort(function (a, b) { return b.score - a.score; });
      return hits;
    }

    /* Escape an HTML snippet and wrap every term occurrence in <mark>. */
    function mergeHighlights(text, terms) {
      var low = text.toLowerCase();
      var ranges = [];
      for (var i = 0; i < terms.length; i++) {
        var term = terms[i];
        var p = low.indexOf(term);
        while (p > -1 && ranges.length < 30) {
          ranges.push([p, p + term.length]);
          p = low.indexOf(term, p + term.length);
        }
      }
      if (!ranges.length) return esc(text);
      ranges.sort(function (a, b) { return a[0] - b[0]; });
      var merged = [ranges[0]];
      for (var i = 1; i < ranges.length; i++) {
        var last = merged[merged.length - 1];
        if (ranges[i][0] <= last[1]) {
          if (ranges[i][1] > last[1]) last[1] = ranges[i][1];
        } else {
          merged.push(ranges[i]);
        }
      }
      var out = '';
      var pos = 0;
      for (var j = 0; j < merged.length; j++) {
        out += esc(text.slice(pos, merged[j][0])) + '<mark>' +
          esc(text.slice(merged[j][0], merged[j][1])) + '</mark>';
        pos = merged[j][1];
      }
      out += esc(text.slice(pos));
      return out;
    }

    /* A body excerpt centered on the first match, capped to ~60 + term + 140
       chars, with every term occurrence highlighted. */
    function summarize(doc, terms) {
      var body = String(doc.b || '');
      var low = body.toLowerCase();
      var at = -1;
      for (var i = 0; i < terms.length; i++) {
