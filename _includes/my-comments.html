{% if site.waline.enable %}
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
<div id="waline-thread"></div>
<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
  init({
    el: '#waline-thread',
    serverURL: '{{ site.waline.serverurl }}',
    /* Hydejack's dark toggle puts `dark-mode` on <body> — Waline re-renders
       dark whenever the selector matches. */
    dark: 'body.dark-mode',
    /* anonymous comments like Valine: all three fields optional */
    meta: ['nick', 'mail', 'link'],
    /* pageview: counts this page + fills every .waline-pageview-count span */
    pageview: true,
  });
</script>
{% endif %}
