# Strings
# =======================================================================================
# This file contains all soft-coded strings of the theme.
# You can edit them here if you want to change the wording of certain phrases,
# e.g. maybe you prefer "Fetching…" to "Loading…", etc.
#
# You can also use this to "translate" the theme into different langauges,
# but note that this may not work in all situations,
# especially for languages that differ significantly from English.

# Free version
# ---------------------------------------------------------------------------------------
home:                  主页
pages:                 页面
posts:                 笔记
about:                 关于
related_posts:         相关笔记
other_projects:        其他项目
comments:              评论
jump_to:               跳转
navigation:            导航
social:                社交
links:                 链接
pagination:            分页
newer:                 下一页
older:                 上一页
back:                  返回
permalink:             固定链接
permalink_icon:        icon-link
templates:             Templates (for web app)
present:               present

loading:               加载中…
redirecting:           跳转中…

continue_reading:      >
  继续阅读...<!--post_title-->

cookies_banner:
  text:                >
    本站使用 Cookies 进行访问统计。[Cookies 政策](/cookies-policy/)。
  okay:                好

not_found:
  title:               '404：页面不存在'
  message:             |
    抱歉，该链接已被移动，或指向一个不存在的地方。
    请<!--home_link-->重新找找看。
  home_link:           回到主页

error:
  title:               出错了
  message:             |
    抱歉，加载 <!--link--> 时发生了错误。

# Separators
# ---------------------------------------------------------------------------------------
colon:                 ':'
separator:             '|'
category_start:        '收录于 '
category_spearator:    ' / '
tag_start:             '标签 '
tag_separator:         '、'
from_to_separator:     '–'


# Date formats
# ---------------------------------------------------------------------------------------
date_formats:
  post:                '%Y年%-m月%-d日'
  related_post:        '%Y年%-m月%-d日'
  modified:            '%Y年%-m月%-d日'
  list_group_by:       '%Y'
  list_entry:          '%-m月%-d日'
  project:             '%Y'
  projects_group_by:   '%Y'
  resume:              '%Y年%m月'


